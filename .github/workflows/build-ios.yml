name: Build CW Datacenter iOS 1.6.12 IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "CWDatacenter/**"
      - "CWDatacenterShare/**"
      - "CWDatacenter.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source version and web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f CWDatacenter/Resources/Web/index.html
          test -f CWDatacenter/Resources/Web/app.js
          test -f CWDatacenter/App/AppLogger.swift
          test -f CWDatacenterShare/ShareViewController.swift
          SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' CWDatacenter/Info.plist)"
          SOURCE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' CWDatacenter/Info.plist)"
          test "$SOURCE_VERSION" = "1.6.12"
          test "$SOURCE_BUILD" = "10612"
          grep -q "cw-web-version\" content=\"$SOURCE_VERSION" CWDatacenter/Resources/Web/index.html
          grep -q "CW_WEB_VERSION = '$SOURCE_VERSION'" CWDatacenter/Resources/Web/app.js

      - name: Build app without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CWDatacenter.xcodeproj \
            -scheme CWDatacenter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'CWDatacenter.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Web/index.html"
          test -f "$APP_PATH/Web/app.js"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$APP_VERSION" = "1.6.12"
          test "$APP_BUILD" = "10612"
          test -d "$APP_PATH/PlugIns/CWDatacenterShare.appex"
          grep -q "cw-web-version\" content=\"$APP_VERSION" "$APP_PATH/Web/index.html"
          grep -q "CW_WEB_VERSION = '$APP_VERSION'" "$APP_PATH/Web/app.js"
          # Keep the legacy output name because the existing GitHub pipeline
          # and download step expect this exact filename.
          IPA_BASENAME="CW-Datacenter-iOS-1.4.0-unsigned"
          rm -rf package
          mkdir -p package/Payload
          ditto "$APP_PATH" package/Payload/CWDatacenter.app
          (cd package && /usr/bin/zip -qry "../${IPA_BASENAME}.ipa" Payload)
          shasum -a 256 "${IPA_BASENAME}.ipa" > "${IPA_BASENAME}.ipa.sha256"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW-Datacenter-iOS-1.4.0-unsigned
          path: |
            CW-Datacenter-iOS-1.4.0-unsigned.ipa
            CW-Datacenter-iOS-1.4.0-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
